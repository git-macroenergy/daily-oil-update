backend:
  name: github
  repo: yourusername/macroenergy-main   # <-- change to your actual GitHub username/repo
  branch: main

media_folder: "assets/images/legacy"
public_folder: "/assets/images/legacy"

publish_mode: simple

collections:
  - name: "home"
    label: "Home Page"
    files:
      - label: "Home"
        name: "home"
        file: "index.markdown"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/" }
          - { label: "Section", name: "section", widget: "hidden", default: "" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "updates"
    label: "Updates"
    folder: "pages/updates"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string", hint: "e.g. /updates/my-new-post/" }
      - { label: "Section", name: "section", widget: "hidden", default: "updates" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "insights"
    label: "Insights"
    folder: "pages/insights"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
