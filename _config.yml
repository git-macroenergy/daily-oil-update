theme: minima

url: "https://macroenergy.net"
baseurl: ""

title: "MacroEnergy"
tagline: "Energy Systems Analysis"
description: "Understand and explore the vast world of macro energy, encompassing the study of large-scale energy systems, policies, and trends that shape our global energy landscape."

markdown: kramdown

# Only affects the posts collection (the daily feed) - pages use their own
# explicit `permalink` in front matter and are unaffected by this.
permalink: /daily/:year/:month/:day/:title/

paginate: 20
paginate_path: /daily/page:num/

minima:
  skin: dark
  social_links:
    - { platform: github, user_url: "https://github.com/yourusername" }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
