name: Daily oil/refining post

on:
  schedule:
    # 12:00 UTC daily — adjust to your preferred publish time
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "oil-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _posts data/post-log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily post: $(date -u +%Y-%m-%d)"
            git push
          fi
